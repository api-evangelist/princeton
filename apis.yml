- aid: princeton:bibdata
  name: PUL Bibliographic Data Web Service (Bibdata)
  x-operator: institution
  description: >-
    Princeton University Library's own bibliographic data service at bibdata.princeton.edu. A Rails application
    (pulibrary/bibdata) that reads from Alma and re-serves bibliographic records, holdings, delivery and
