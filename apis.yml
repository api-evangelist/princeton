  x-operator: institution
  description: >-
    Princeton's campus identity provider publishes signed SAML 2.0 metadata at idp.princeton.edu/idp/shibboleth.
    The EntityDescriptor names Princeton University, carries administrative, support and technical contacts
    at princeton.edu, declares protocolSupportEnumeration for Shibboleth 1.0, SAML 1.1 and SAML 2.0, and
    publishes signing and encryption key descriptors plus shibmd:Scope elements. This is a machine-readable
    contract that is institution-operated by definition, it is the university pipeline's IdentityFederation
    class, and it is Princeton's verified shibboleth and saml conformance under the education regime.
    It is also almost never catalogued anywhere.
