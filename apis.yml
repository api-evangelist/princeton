- aid: princeton:oit-api-gateway
  name: Princeton OIT API Gateway
  x-operator: institution
  description: >-
    Princeton's Office of Information Technology enterprise API gateway, running WSO2 API Manager. Fronts
    institutional APIs — ActiveDirectory user and group lookups, PrincetonInfo departmental data, a MobileApp
    surface carrying course, dining and campus places data, and the LibAlma patron feed the Library consumes.
    Every call requires a bearer token obtained through a NetID or departmental service-account subscription,
    so the surface is real but invisible to the public: anonymous requests return 401 with an empty body.
    The API Store developer portal that used to front it, api-store.princeton.edu, no longer resolves
    (NXDOMAIN, 2026-08-19), and no successor portal is published, so the gateway currently has no discoverable
    documentation of any kind. This is the course-catalog and registrar surface the university pipeline
    hunts for — it exists, and it is closed.
