apis:
- aid: princeton:art-museum-api
  name: Princeton University Art Museum API
  x-operator: institution
  description: >-
    Open, REST-style API providing developer access to data about the Princeton University Art Museum
    and its collections. Four surfaces: objects (with a label-level /tombstone sub-resource and filtering
    by maker, department, term and on-view status), makers, packages, and a full-text search endpoint
    that returns the raw Elasticsearch envelope. Pagination and incremental harvesting are supported via
    size, from, sort, sortorder and lastupdated. No authentication is currently required, though the Museum
    documents that this may change. Weekly-refreshed static JSON dumps of the whole collection are offered
    alongside the API for bulk and machine-learning use. The Museum publishes prose documentation, not
    a contract; the OpenAPI in this repo is DERIVED from that documentation and verified against live
    responses, and is not Princeton's own artifact.
  humanURL: https://github.com/Princeton-University-Art-Museum/puam-api-docs
