---
aid: princeton
name: Princeton University
description: >-
  Princeton University is a private Ivy League research university in Princeton, New Jersey.
  Its programmable footprint is real but almost entirely the work of one unit — Princeton
  University Library — and it is one of the few institutions in this cohort that operates its
  own machine-readable contract rather than a vendor's. The Library publishes an OpenAPI 3.1.1
  document for its Allsearch API at allsearch-api.princeton.edu, serves a Swagger UI alongside
  it, open-sources the application behind it, and runs a family of unauthenticated Blacklight
  JSON endpoints across the catalog, digital collections, finding aids, maps and the Princeton
  Data Commons research-data portal. The Art Museum runs a separate open, no-authentication
  collections API documented in prose on GitHub. Princeton also operates its own Shibboleth
  identity provider with published SAML 2.0 metadata, an OAI-PMH 2.0 endpoint on Figgy, and
  DataCite DOI registration under three of its own repository clients. Everything outside the
  Library is gated: the OIT enterprise gateway at api.princeton.edu runs WSO2 API Manager behind
  NetID or service-account OAuth2, and the developer portal that used to front it,
  api-store.princeton.edu, no longer resolves at all. Course, registrar, dining and directory
  data exist as APIs but are not reachable by anyone without a Princeton credential, so no
  public course-catalog surface is claimed here. Princeton's teaching and library-discovery
  layers are vendor tenancies — Canvas and Ex Libris Alma/Primo — and are recorded as
  relationships, not as Princeton contracts.
