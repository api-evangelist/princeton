openapi: 3.2.0
info:
  title: Allsearch Article API
  description: Backend API for allsearch.princeton.edu
  version: v1
servers:
- url: https://allsearch-api.princeton.edu
- url: https://allsearch-api-staging.princeton.edu
tags:
- name: Article
paths:
  /search/article:
    parameters:
    - name: query
      in: query
      description: A string to query the Summon API, aka Articles+
      schema:
        type: string
    get:
      summary: /search/article?query={query}
      tags:
      - Article
      operationId: searchArticle
      description: Searches the Summon API using a query term. Excludes Newspaper Articles and items not held by PUL
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                number: 998201
