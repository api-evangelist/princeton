                    publication_year: '2022'
                    fulltext_available: Full-text available
                    abstract: This study was conducted to determine the aphicidal effect of a leaf extract of the Atlantic potato cultivar on the performance of green peach aphids. Three concentrations of the leaf extract (100, 75, and 50% potato extract), synthetic pesticide (Beta cypermethrin 4.5%), and distilled water (control) treatments were applied in a greenhouse experiment. The results showed that the synthetic pesticide, which was used as a standard check, caused the maximum aphid mortality, followed by the 100% potato leaf extract. Compared with the other botanical treatments, the 100% extract produced low mean rates of survival, aphids’ average daily reproduction, the number of nymphs per plant, and the number of nymphs per adult. This treatment also increased the accumulation of hydrogen Peroxide (H[sub.2]O[sub.2]) and malondialdehyde (MDA), glutathione-s-transferase, mixed-function oxidase, and carboxylesterase content in the green peach aphid. Moreover, the 100% extract also protected the host plants against green peach aphid attacks by demonstrating higher chlorophyll content, net photosynthesis, above-ground fresh weight, and above-ground dry weight of the host plant. This study demonstrates that the highest concentration of potato (Atlantic cultivar) leaf extract (100% extract) could be used as the appropriate dosage for the control of green peach aphids on potatoes, which could greatly reduce the use of synthetic insecticides and promote ecosystem sustainability.
